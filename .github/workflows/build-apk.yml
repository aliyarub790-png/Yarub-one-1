name: Build YARUB ONE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "yarub-one.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract YARUB ONE project
        run: |
          rm -rf source
          mkdir source
          unzip -q yarub-one.zip -d source

          find source -type f -name settings.gradle.kts -print
          find source -type f -name build.gradle.kts -print

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find Android project
        id: android
        run: |
          ANDROID_DIR=$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "Android project not found."
            exit 1
          fi

          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
