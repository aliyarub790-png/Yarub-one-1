name: YARUB ONE APK

on:
  workflow_dispatch:

jobs:
  android:
    name: Build YARUB ONE Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          DIR=""

          if [ -f "android/gradlew" ]; then
            DIR="android"
          elif [ -f "yarub-one/android/gradlew" ]; then
            DIR="yarub-one/android"
          elif [ -f "source/yarub-one/android/gradlew" ]; then
            DIR="source/yarub-one/android"
          fi

          if [ -z "$DIR" ]; then
            echo "Gradle wrapper was not found."
            echo "Searching for Android projects:"
            find . -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print
            exit 1
          fi

          echo "Android project: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Locate APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YARUB-ONE-debug-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
