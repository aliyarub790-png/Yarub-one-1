name: Build YARUB ONE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check YARUB ONE ZIP
        run: |
          set -e

          if [ ! -f "yarub-one.zip" ]; then
            echo "yarub-one.zip was not found in repository root."
            exit 1
          fi

          echo "YARUB ONE ZIP found."
          unzip -t yarub-one.zip

      - name: Extract YARUB ONE
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q yarub-one.zip -d source

          echo "Project structure:"
          find source/yarub-one/android -maxdepth 3 -type f | sort

      - name: Verify Android project
        run: |
          set -e

          test -f source/yarub-one/android/settings.gradle.kts
          test -f source/yarub-one/android/build.gradle.kts
          test -f source/yarub-one/android/app/build.gradle.kts

          echo "Android project verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build YARUB ONE Debug APK
        working-directory: source/yarub-one/android
        run: |
          gradle --no-daemon \
            --stacktrace \
            --info \
            assembleDebug \
            -PYARUB_API_BASE_URL_DEBUG="http://10.0.2.2:3000"

      - name: Find APK
        run: |
          echo "Searching for generated APK..."
          find source/yarub-one/android/app/build \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload YARUB ONE APK
        uses: actions/upload-artifact@v4
        with:
          name: YARUB-ONE-debug-APK
          path: source/yarub-one/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
