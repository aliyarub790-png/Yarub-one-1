name: Build YARUB ONE APK

on:
  workflow_dispatch:

  push:
    paths:
      - "yarub-one.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract YARUB ONE project
        run: |
          rm -rf source
          mkdir -p source
          unzip -q yarub-one.zip -d source

          test -f source/yarub-one/android/settings.gradle.kts
          test -f source/yarub-one/android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: source/yarub-one/android
        run: |
          gradle --no-daemon assembleDebug \
            -PYARUB_API_BASE_URL_DEBUG="${{ vars.YARUB_API_BASE_URL_DEBUG }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: source/yarub-one/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
