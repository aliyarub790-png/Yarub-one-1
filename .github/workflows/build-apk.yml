name: Build YARUB ONE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f yarub-one.zip
          unzip -l yarub-one.zip | head -50

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q yarub-one.zip -d source
          find source -name settings.gradle.kts -print

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          ANDROID_DIR=$(find source -name settings.gradle.kts -printf '%h\n' | head -1)
          cd "$ANDROID_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
