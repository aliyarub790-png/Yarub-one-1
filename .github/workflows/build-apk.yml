package one.yarub.app.data

import kotlinx.coroutines.Dispatchers
import kotlinx.coroutines.withContext
import one.yarub.app.ApiConfig
import org.json.JSONArray
import org.json.JSONObject
import java.io.BufferedReader
import java.net.HttpURLConnection
import java.net.URL

class YarubApi(private val session: SessionStore) {

    data class Result<T>(
        val value: T?,
        val errorCode: String?,
        val message: String?
    ) {
        val isSuccess: Boolean
            get() = value != null
    }

    suspend fun login(
        email: String,
        password: String
    ): Result<Unit> {
        return postJson(
            "/api/auth/login",
            JSONObject()
                .put("email", email)
                .put("password", password)
        ).map { Unit }
    }

    suspend fun register(
        email: String,
        password: String,
        locale: String
    ): Result<Unit> {
        return postJson(
            "/api/auth/register",
            JSONObject()
                .put("email", email)
                .put("password", password)
                .put("locale", locale)
        ).map { Unit }
    }

    suspend fun logout(): Result<Unit> {
        val result = postJson(
            "/api/auth/logout",
            JSONObject()
        ).map { Unit }

        session.clear()
        return result
    }

    suspend fun projects(): Result<List<Project>> {
        return getJson("/api/projects").map { body ->

            val array =
                body.optJSONArray("projects")
                    ?: JSONArray()

            (0 until array.length()).map { index ->

                val row =
                    array.getJSONObject(index)

                Project(
                    id = row.getString("id"),
                    title = row.getString("title"),
                    domain = row.optString("domain"),
                    language = row.optString(
                        "language",
                        "ar"
                    )
                )
            }
        }
    }

    suspend fun entitlements(): Result<Entitlements> {
        return getJson("/api/entitlements").map { body ->

            val allowance =
                body.optJSONArray("allowance")
                    ?: JSONArray()

            Entitlements(
                planCode =
                    body.optString(
                        "planCode",
                        "free"
                    ),

                allowance =
                    (0 until allowance.length()).map { index ->

                        val row =
                            allowance.getJSONObject(index)

                        Allowance(
                            action =
                                row.getString("action"),

                            used =
                                row.getInt("used"),

                            limit =
                                row.getInt("limit"),

                            remaining =
                                row.getInt("remaining")
                        )
                    }
            )
        }
    }

