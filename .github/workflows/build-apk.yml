name: Build YARUB ONE APK

on:
  workflow_dispatch:
  push:
    paths:
      - "yarub-one.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract YARUB ONE project
        run: |
          rm -rf source
          mkdir source
          unzip -q yarub-one.zip -d source

          echo "=== Project files ==="
          find source -maxdepth 4 -type f | head -200

      - name: Find Android project
        id: android
        run: |
          ANDROID_DIR=$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "Android project: $ANDROID_DIR"
          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle project
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          echo "=== Gradle files ==="
          ls -la
          echo "=== Java/Kotlin files ==="
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) | sort

      - name: Build Debug APK with full compiler diagnostics
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          set -o pipefail
          gradle --no-daemon \
            :app:compileDebugKotlin \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/kotlin-build.log"

      - name: Build APK
        working-directory: ${{ steps.android.outputs.dir }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-build-log
          path: kotlin-build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yarub-one-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
